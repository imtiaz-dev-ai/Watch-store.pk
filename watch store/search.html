<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Results | Watch Store — Time In Style</title>
  <meta name="description" content="Shop authentic watches at Watch Store ? Pakistan's premium destination for style and precision.">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="stylesheet" href="assets/css/store.css">
</head>
<body data-page="search">
  <noscript><div style="background:#7a1f1f;color:#fff;padding:10px 16px;text-align:center">Please enable JavaScript to browse Watch Store.</div></noscript>
  <div id="site-header"></div>
  <main id="app"><section class="page-hero">
      <div class="container"><h1>Search <em>Results</em></h1><div class="breadcrumb"><a href="#/home">Home</a><span class="sep">›</span><span class="cur">Search</span></div></div>
    </section>

    <section class="shop-section">
      <div class="container">
        <p id="search-meta" style="color:var(--muted);font-size:14.5px;margin-bottom:24px"></p>
        <div class="search-filters" id="search-filters" aria-label="Filter search results">
          <label>Category
            <select id="search-category"><option value="">All categories</option><option value="men">Men's watches</option><option value="women">Women's watches</option><option value="luxury">Luxury watches</option></select>
          </label>
          <label>Brand <select id="search-brand"><option value="">All brands</option></select></label>
          <label>Sort
            <select id="search-sort"><option value="featured">Featured</option><option value="price-asc">Price: Low to High</option><option value="price-desc">Price: High to Low</option><option value="name">Name A–Z</option></select>
          </label>
        </div>
        <div class="products-grid cols-3" id="search-grid"></div>
      </div>
    </section></main>
  <div id="site-footer"></div>
  <script src="assets/js/store.js"></script>
</body>
</html>
