<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch Store — Time In Style</title>
  <meta name="description" content="Visit Watch Store for premium watches, customer support, and order information.">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="stylesheet" href="assets/css/store.css">
</head>
<body class="legacy-redirect">
  <main class="legacy-redirect-card">
    <img src="assets/img/logo.png" alt="Watch Store — Time In Style">
    <p>This store page has moved. You can continue to the Watch Store homepage below.</p>
    <a class="btn" href="index.html">Go to Watch Store</a>
  </main>
  <script>
    const pages = {
      home: 'index.html',
      mens: 'mens-watches.html',
      womens: 'womens-watches.html',
      luxury: 'luxury-watches.html',
      sale: 'sale.html',
      brands: 'brands.html',
      contact: 'contact.html',
      'track-order': 'track-order.html',
      cart: 'cart.html',
      checkout: 'checkout.html',
      account: 'account.html',
      wishlist: 'wishlist.html',
      product: 'product.html',
      search: 'search.html',
      faqs: 'faqs.html',
      shipping: 'shipping-policy.html',
      returns: 'return-policy.html',
      privacy: 'privacy-policy.html',
      terms: 'terms-conditions.html',
    };
    const match = location.hash.match(/^#\/([^?]+)(?:\?(.*))?$/);
    const destination = match ? pages[match[1]] || 'index.html' : 'index.html';
    const query = match && match[2] ? `?${match[2]}` : match ? '' : location.search;
    location.replace(destination + query);
  </script>
</body>
</html>
